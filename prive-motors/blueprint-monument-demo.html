<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint monument — white background demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..800&display=swap" rel="stylesheet">

<style>
  :root{ --display:'Jost', sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#fff; font-family:var(--display); }

  .section{ padding:6rem 1rem; background:#fff; }

  .stage{ position:relative; width:min(94vw,1500px); margin:0 auto; aspect-ratio:1800/874; }

  .stage .word,
  .stage .word-clip{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:800; text-transform:uppercase;
    letter-spacing:-0.045em; font-size:clamp(3rem,9.5vw,8.5rem); white-space:nowrap;
  }
  .stage .word{ color:#000; z-index:1; }

  /* dark-line car (blueprintbelapozadina, background removed) — visible as-is
     against the white page background, spans the full stage */
  .stage .car-visible{
    position:absolute; inset:0; z-index:2;
    background-image:url(demo-assets/blueprint2/car-on-white.png);
    background-size:100% 100%; background-repeat:no-repeat;
  }

  /* white-line car (blueprintcrnapozadina, background removed) — clipped to the
     exact glyph shapes of the same word, same box/background-size as .car-visible
     so both car layers share one coordinate space and land pixel-identical */
  .stage .word-clip{
    z-index:3; color:transparent; -webkit-text-fill-color:transparent;
    background-image:url(demo-assets/blueprint2/car-on-black.png);
    background-size:100% 100%; background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text;
  }
</style>
</head>
<body>

  <div class="section">
    <div class="stage">
      <div class="word">A Lifestyle</div>
      <div class="car-visible"></div>
      <div class="word-clip">A Lifestyle</div>
    </div>
  </div>

</body>
</html>
