<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About monument — blueprint swap (local demo)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0A1628;
    --bg-deep: #050B14;
    --text: #F2E6D7;
    --rose: #D4AF8C;
    --display: 'Jost', sans-serif;
    --sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  .container{ max-width:85rem; margin:0 auto; padding:0 clamp(1.5rem,4vw,4.5rem); }

  /* ── everything below is copied verbatim from about.html's .monument block —
     only the image path in .monument-car-bg / .monument-reveal-mask changed from
     the Tesla photo to the blueprint car (background already removed, transparent
     everywhere but the line art, same as the Tesla cutout was) ── */
  .monument{ position:relative; margin-top:2rem; padding:2rem 0 5rem; overflow:hidden; }
  .monument-inner{ position:relative; height:clamp(420px,46vw,620px); display:flex; align-items:center; justify-content:center; }
  .monument-word{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scaleY(1.22); z-index:1;
    font-family:var(--display); font-weight:800; text-transform:uppercase; letter-spacing:-0.045em;
    font-size:clamp(5.5rem,16vw,11.5rem); color:var(--bg-deep); white-space:nowrap; }
  .monument-car-stage{ position:absolute; top:50%; left:50%;
    width:min(58%,760px); aspect-ratio:1500/938;
    transform:translate(-50%, calc(-50% - 18.6%)); z-index:2; }
  .monument-car-bg{ position:absolute; inset:0;
    background-image:url(demo-assets/blueprint2/car-on-black.png);
    background-size:100% 100%; background-repeat:no-repeat; }
  .monument-reveal-mask{ position:absolute; inset:0; z-index:1;
    -webkit-mask-image:url(demo-assets/blueprint2/car-on-black.png);
    mask-image:url(demo-assets/blueprint2/car-on-black.png);
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-mode:alpha; mask-mode:alpha; }
  .monument-reveal-text{ position:absolute; left:50%; top:calc(50% + 18.6%);
    transform:translate(-50%,-50%) scaleY(1.22);
    font-family:var(--display); font-weight:800; text-transform:uppercase; letter-spacing:-0.045em;
    font-size:clamp(5.5rem,16vw,11.5rem); white-space:nowrap; color:#EDEAE4; }
</style>
</head>
<body>

  <section class="monument">
    <div class="container">
      <div class="monument-inner">
        <div class="monument-word">A Lifestyle</div>
        <div class="monument-car-stage" role="img" aria-label="Blueprint car">
          <div class="monument-car-bg"></div>
          <div class="monument-reveal-mask"><div class="monument-reveal-text">A Lifestyle</div></div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
